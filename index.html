<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sky Coffee</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1 class="logo-container">
            <a href="#">
                <img src="images/logo.png" alt="Sky Coffee">
            </a>
        </div>
    </header>

    <section class="main-visual-wrapper">
        <picture>
            <source media="(min-width: 768px)" srcset="images/pc_main-visual.jpg">
            <img src="images/sp_main-visual.jpg" alt="複数の青いカップのコーヒー">
        </picture>
    </section>

    <section class="global-nav-wrapper">
        <div class="global-nav-container">
            <ul>
                <li><a href="#">menu</a></li>
                <li><a href="#">blog</a></li>
                <li><a href="#">access</a></li>
            </ul>
        </div>
    </section>

    <section class="concept-wrapper">
        <div class="concept-container">
            <div class="concept-image">
                <img src="images/concept.jpg">
            </div>
            <div class="concept-text">
                <div class="concept-subtitle">Concept</h1>
                <h2 class="concept-title">心静かにコーヒーを</h2>
                <p class="description">
                    立ち止まって、<br>
                    空の青さを眺めて、<br>
                    一息つきましょう
                </p>
            </div>
        </div>
    </section>

    <section class="blog-wrapper">
        <div class="blog-container">
            <h2 class="blog-title">blog</h2>
            <div class="blog-subtitle">ブログ</div>
        </div>
        <div class="blog-list">
            <div class="blog-item-container">
                <article class="blog-item">
                    <a href="#">
                        <img class="blog-image" src="images/thumbnail01.jpg">
                        <p class="blog-title">ブログタイトル</p>
                        <span class="blog-date">2026-00-00</span>
                    </a>
                </article>
            </div>
            <div class="to-blogs-container">
                to-blogs
            </div>
        </div>
    </section>

    <footer>

    </footer>
</body>
</html>
