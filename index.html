<!DOCTYPE html>
<html lang="ja">
<head>

    <title>Sky Coffee</title>

    <link rel="stylesheet" href="css/destyle.css">

<body>
    <header>
        <h1 class="logo-container">
            <a href="#">
                <img src="images/logo.png" alt="Sky Coffee">
            </a>
        </div>

    <div class="main-visual-wrapper">
        <picture>

    <div class="global-nav-wrapper">
